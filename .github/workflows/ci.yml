name: CI

on:
  pull_request:          # no branch filter: stacked PR layers get checked too
  push:
    branches: [main]     # re-checks main after every merge (checks are non-strict)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-checks:
    name: ci-checks      # exact name is a required status check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # pnpm version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      # No model-provider secrets here on purpose: tests must mock the LLM.
